aid: swiss-food-composition-database
name: Swiss Food Composition Database
description: >-
  The Swiss Food Composition Database is the official reference dataset on the nutrient composition of foods
  available in Switzerland, published by the Federal Food Safety and Veterinary Office (FSVO / BLV). Version 7.1
  (1 July 2026) covers 1,246 mostly generic foods across 19 main categories and 106 subcategories, with
  macronutrients, water, alcohol and energy for nearly every food, plus vitamins, minerals, fatty acid groups and
  individual fatty acids for most. The data is published free of charge in German, French, Italian and English,
  for commercial as well as scientific use, subject to acknowledgement of the source. Alongside the Excel export
  and the public search application, the FSVO operates a documented, entirely unauthenticated JSON REST API on
  the FoodCASE platform, described by a served OpenAPI 3.0.1 document with 21 read-only operations covering food
  search, single-food retrieval, nutrient values and their sources, ingredients, LanguaL codes, the category tree,
  component/unit reference data and the current database version.
