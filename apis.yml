apis:
  - name: Swiss Food Composition Database API
    description: >-
      Public, unauthenticated JSON REST API over the Swiss Food Composition Database, served from the FoodCASE
      platform operated for the FSVO. 21 read-only GET operations: food search with category, subcategory and
      nutrient-threshold filters, single food retrieval, nutrient values and their source/provenance records,
      recipe ingredients, LanguaL descriptors, the full category tree, component / component-set / group / unit
      reference data, generic-food counts and the current database version. Every operation accepts a lang
      parameter (de, en, fr, it). No API key, no quota and no rate limiting is documented or observed.
    humanURL: https://api.webapp.prod.blv.foodcase-services.com/BLV_WebApp_WS
    baseURL: https://api.webapp.prod.blv.foodcase-services.com/BLV_WebApp_WS
