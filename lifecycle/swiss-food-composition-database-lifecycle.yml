versioning:
  api:
    scheme: none
    detail: >-
      No version segment in the API path and no info.version in the served document. The provider's Swagger
      UI page labels it 1.0.0 client-side. The API itself has never been re-versioned since it was introduced
      with data version V5.1 on 16.06.2015 ("Possibility to retrieve database through an API").
  data:
    scheme: major.minor
    current: V 7.1
    released: '2026-07-01'
    cadence: >-
      Roughly annual in recent years - V 7.1 (01.07.2026), V 7.0 (01.07.2025), V 6.5 (27.06.2023),
      V 6.4 (13.06.2022), V 6.3 (02.03.2021), V 6.2 (31.03.2020).
    runtime_discovery: GET /webresources/BLV-api/versiondb returns {"idversion":51,"versiontext":"V 7.1"}
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  detail: >-
    No deprecation policy, no notice period, no Sunset or Deprecation headers, and no operation is flagged
    deprecated in the OpenAPI. The one clear legacy surface - GET /webresources/BLV-api/foods_old, whose own
    summary calls it "old foods" - carries no deprecation marker and no removal date. Breaking changes to the
    DATA are, by contrast, well documented: the version history explicitly records unit changes
    (Vitamin A RE/RAE and beta-carotene moved to plain micrograms in V 7.0), a redefinition of Vitamin E in
    V 6.5, a category rename in V 7.0 ("Meat substitutes" to "Plant protein foods and animal product
    substitutes"), and the removal of branded products in V 6.0. Category IDs and food IDs are therefore not
    guaranteed stable across data versions, and nothing in the API signals that.
  deprecated_operations: []
