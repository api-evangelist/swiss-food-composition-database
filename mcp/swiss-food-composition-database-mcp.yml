note: >-
  The Federal Food Safety and Veterinary Office ships NO MCP server, hosted or stdio. The tools below are a
  candidate mapping API Evangelist derived from the 21 published REST operations; nothing here is served by
  the provider and no endpoint has been invented. Because the API is fully anonymous, read-only and
