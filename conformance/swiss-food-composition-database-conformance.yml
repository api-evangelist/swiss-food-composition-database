domain_standards:
  - id: langual
    name: LanguaL international framework for food description
    conforms: true
    evidence: >-
      The contract declares a first-class LanguaL surface: GET /webresources/BLV-api/langualcodes
      (operationId getLangualCodes) returning LangualDTO objects with the LanguaL facet structure
      {letter, description, classification}. Probed live 2026-08-27 with DBID=351915 ("Apple, fresh"):
      returns facet-letter rows such as {"letter":"A","description":"PRODUCT TYPE",
      "classification":"FRUIT OR FRUIT PRODUCT (EUROFIR) (A0833), FRUIT OR FRUIT PRODUCT (US CFR) (A0143)"}.
      This is the domain standard for machine-readable food description, and it is expressed in the API
      contract itself, not merely claimed on a marketing page.
  - id: efsa-foodex2
    name: EFSA FoodEx2 food classification
    conforms: true
    evidence: >-
      The same /langualcodes response carries EFSA FoodEx2 terms verbatim, e.g.
      {"letter":"A","description":"020 - CEREALS AND CEREAL PRIMARY DERIVATIVES (EFSA FOODEX2)"} and
      "840 - BISCUITS, RUSKS AND COOKIES FOR CHILDREN (EFSA FOODEX2)". An EU-regulated consumer of food
      composition data can join on FoodEx2 without a bespoke connector.
  - id: eurofir
    name: EuroFIR food composition data standard (component tagnames + food classification)
    conforms: true
    evidence: >-
      Two independent signatures. (1) GET /webresources/BLV-api/components returns EuroFIR / INFOODS component
      tagnames in the code field - ALC (Alcohol), CA (Calcium), CARTB (Beta-carotene), CHO (Carbohydrates,
      available), CHORL (Cholesterol), ID (Iodide) - alongside the localised names. (2) LanguaL classification
      strings are labelled "(EUROFIR)". The FSVO's own version history records the alignment explicitly:
      version V 2.11 (11.11.2008) states the database was adapted "to the new EuroFIR standards"
      (https://naehrwertdaten.ch/en/versions-and-updates/).
  - id: value-provenance
    name: Per-value source, method and reference documentation (EuroFIR-style data quality documentation)
    conforms: true
    evidence: >-
      Every nutrient value carries its own provenance in the contract: the Value / ValueFormatted schemas
      expose references[] (citation, title, authors, typeDescriptor), valueTypeCode, methodIndicatorCode,
      methodtypecode, minimum, maximum, n, isborrowed, isrescaled, isfixed, and contributingvalues, and a
      dedicated GET /webresources/BLV-api/source/{DBID} returns the SourceValueDTO for one value. Probed
      2026-08-27: "Apple, fresh" calcium cites "Anses - Table de composition nutritionnelle des aliments
      Ciqual 2020" with methodIndicatorCode MIR003. Very few food APIs publish borrowed-value flags and
      per-value citations at all.
compliance:
  published_certifications: []
  note: >-
    No SOC 2, ISO 27001 or comparable certification is published, and no trust centre exists - this is a
    Swiss federal office publication, governed by federal law and the site's legal-information page
    (https://naehrwertdaten.ch/en/legal-information/) rather than by a commercial assurance programme.
    No Compliance pointer is emitted for that reason.
  data_protection: >-
    https://naehrwertdaten.ch/en/legal-information/ states adherence to Article 13 of the Swiss Federal
    Constitution and Swiss data protection legislation, and records BUEPF six-month connection-data retention.
    The API itself is anonymous and processes no personal data.
regulatory_context:
  jurisdiction: Switzerland
  publisher: Federal Food Safety and Veterinary Office (FSVO / BLV)
  note: >-
    Nutrient declaration in Switzerland is governed by the Foodstuffs and Utility Articles Act and its
    ordinances; the database's "Food labelling" component set (id 3, observed live at
    /webresources/BLV-api/sets) is the subset aligned to declaration requirements. Recorded as context,
    not as a conformance claim.
